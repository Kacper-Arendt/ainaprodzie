databaseChangeLog:
  - changeSet:
      id: db-202610082033-ticket
      author: retrofit
      context: schema
      comment: >-
        Support ticket; closed_at is set exactly when the status is CLOSED. The author must be a customer of the
        ticket's organization and the assignee a member of the ticket's team, both through composite foreign keys
        onto app_user.
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket (
                  id uuid PRIMARY KEY,
                  number bigint GENERATED BY DEFAULT AS IDENTITY (START WITH 1001) NOT NULL,
                  title text NOT NULL
                      CONSTRAINT ticket_title_not_blank_check CHECK (btrim(title) <> ''),
                  description text NOT NULL,
                  organization_id uuid NOT NULL REFERENCES organization (id),
                  author_id uuid NOT NULL,
                  category text NULL
                      CONSTRAINT ticket_category_check CHECK (category IN ('BUG','QUESTION','FEATURE_REQUEST')),
                  priority text NOT NULL DEFAULT 'NORMAL'
                      CONSTRAINT ticket_priority_check CHECK (priority IN ('LOW','NORMAL','HIGH','CRITICAL')),
                  status text NOT NULL DEFAULT 'NEW'
                      CONSTRAINT ticket_status_check
                      CHECK (status IN ('NEW','IN_PROGRESS','WAITING_FOR_CUSTOMER','RESOLVED','CLOSED')),
                  team_id uuid NULL REFERENCES team (id),
                  assignee_id uuid NULL,
                  resolution text NULL,
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL,
                  first_response_at timestamptz NULL,
                  closed_at timestamptz NULL,
                  version bigint NOT NULL DEFAULT 0,
                  CONSTRAINT ticket_number_ux UNIQUE (number),
                  CONSTRAINT ticket_author_fk FOREIGN KEY (author_id, organization_id)
                      REFERENCES app_user (id, organization_id),
                  CONSTRAINT ticket_assignee_fk FOREIGN KEY (assignee_id, team_id) REFERENCES app_user (id, team_id),
                  CONSTRAINT ticket_assignee_needs_team_check CHECK (assignee_id IS NULL OR team_id IS NOT NULL),
                  CONSTRAINT ticket_first_response_after_creation_check
                      CHECK (first_response_at IS NULL OR first_response_at >= created_at),
                  CONSTRAINT ticket_closed_at_check
                      CHECK ((status = 'CLOSED') = (closed_at IS NOT NULL)
                          AND (closed_at IS NULL OR closed_at >= created_at))
              );

              CREATE INDEX ticket_organization_ix ON ticket (organization_id);
              CREATE INDEX ticket_author_ix ON ticket (author_id);
              CREATE INDEX ticket_team_ix ON ticket (team_id);
              CREATE INDEX ticket_assignee_ix ON ticket (assignee_id);
              CREATE INDEX ticket_updated_at_ix ON ticket (updated_at);
      rollback:
        - sql:
            sql: DROP TABLE ticket;
