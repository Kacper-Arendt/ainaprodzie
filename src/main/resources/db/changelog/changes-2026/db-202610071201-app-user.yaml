databaseChangeLog:
  - changeSet:
      id: db-202610071201-app-user
      author: retrofit
      context: schema
      comment: Application user account; roles and language are constrained at DB level.
      changes:
        - sql:
            sql: |
              CREATE TABLE app_user (
                  id uuid PRIMARY KEY,
                  email text NOT NULL,
                  display_name text NOT NULL,
                  password_hash text NOT NULL,
                  roles text[] NOT NULL
                      CONSTRAINT app_user_roles_check
                      CHECK (cardinality(roles) > 0 AND roles <@ ARRAY['USER','SUPPORT']::text[]),
                  enabled boolean NOT NULL DEFAULT true,
                  organization_id uuid NULL,
                  language text NOT NULL DEFAULT 'en'
                      CONSTRAINT app_user_language_check
                      CHECK (language IN ('en','pl')),
                  created_at timestamptz NOT NULL,
                  updated_at timestamptz NOT NULL
              );

              CREATE UNIQUE INDEX app_user_email_lower_ux ON app_user (lower(email));

              COMMENT ON COLUMN app_user.organization_id IS
                  'Owning organization; the foreign key arrives with the organizations table.';
      rollback:
        - sql:
            sql: DROP TABLE app_user;
